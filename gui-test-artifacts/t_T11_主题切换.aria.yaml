- text: 按域名自动分组 浏览器抓取的请求自动归入以「域名」命名的分组（如 api.example.com）。 仅作用于新抓取的记录，已存在的分组不受影响。
- button "按域名自动分组 浏览器抓取的请求自动归入以「域名」命名的分组（如 api.example.com）。 仅作用于新抓取的记录，已存在的分组不受影响。"
- img
- text: 按完整 URL 去重 默认仅按 method+host+path 去重（忽略 query）。开启后，不同 query 参数的同接口会被视为不同接口分别记录。
- button "按完整 URL 去重 默认仅按 method+host+path 去重（忽略 query）。开启后，不同 query 参数的同接口会被视为不同接口分别记录。"
- img
- text: 严格校验 TLS 证书 关闭时接受自签名 / 内网证书（默认，适合调试）；开启后会对 HTTPS 目标做证书校验，自签名证书会被拒绝。
